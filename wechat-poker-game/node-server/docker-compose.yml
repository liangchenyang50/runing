services:
  app:
    build:
      context: ..
      dockerfile: node-server/Dockerfile
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: four_player_poker
      MYSQL_USER: poker_user
      MYSQL_PASSWORD: change_this_password
      MYSQL_ROOT_PASSWORD: change_root_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pchange_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql-data:
